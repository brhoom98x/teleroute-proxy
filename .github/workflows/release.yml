name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build
        run: gradle test fatJar --no-daemon --stacktrace

      # Everything install.sh needs comes from the release, so a target machine only ever talks to
      # one URL rather than cloning the repository.
      - name: Collect assets
        id: assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC=$(ls build/libs/*-all.jar | head -1)
          test -f "$SRC" || { echo "fat jar missing"; exit 1; }
          cp "$SRC" "teleroute-proxy-${VERSION}.jar"
          cp deploy/teleroute-proxy.service teleroute-proxy.service
          cp teleroute.conf.example teleroute.conf.example
          cp install.sh install.sh
          sha256sum "teleroute-proxy-${VERSION}.jar" > SHA256SUMS
          echo "jar=teleroute-proxy-${VERSION}.jar" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          JAR: ${{ steps.assets.outputs.jar }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$JAR" teleroute-proxy.service teleroute.conf.example install.sh SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "TeleRoute proxy $GITHUB_REF_NAME" \
            --notes "Self-contained SOCKS5 proxy. Needs a JRE 17 or newer and nothing else.

          Install on any Linux host with systemd:

          \`\`\`
          curl -fsSL -o install.sh <install.sh asset URL>
          sudo bash install.sh
          \`\`\`

          Authentication is mandatory and only Telegram destinations are relayed by default. Verify the download against SHA256SUMS."
